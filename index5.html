<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbekiston Davlatchiligi Tarixi - 3D Seminari</title>
    <!-- Three.js va kutubxonalar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* 3D Oyna stili */
        #canvas-container {
            width: 55%;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Slayd ma'lumotlar oynasi */
        #slide-container {
            width: 45%;
            height: 100vh;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.98);
            border-left: 1px solid #334155;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            z-index: 10;
            overflow-y: auto;
        }

        .slide-header {
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 12px;
        }

        .slide-number {
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .slide-title {
            font-size: 1.55rem;
            color: #ffffff;
            margin-top: 5px;
            line-height: 1.3;
        }

        .slide-content {
            margin: 18px 0;
            font-size: 0.98rem;
            line-height: 1.65;
            color: #cbd5e1;
            text-align: justify;
        }

        .slide-source {
            background: #1e293b;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            font-size: 0.82rem;
            color: #94a3b8;
            margin-top: 10px;
        }

        /* Boshqaruv tugmalari */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        /* Loading indicator */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            display: none;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid #38bdf8;
        }

        /* Adaptiv */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            #canvas-container { width: 100%; height: 45vh; }
            #slide-container { width: 100%; height: 55vh; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 3D Modellar Ekrani -->
    <div id="canvas-container">
        <canvas id="canvas3d"></canvas>
        <div id="loader">3D Model yuklanmoqda...</div>
    </div>

    <!-- Slayd Matnlari -->
    <div id="slide-container">
        <div>
            <div class="slide-header">
                <div class="slide-number" id="slide-num">Slayd 1 / 20</div>
                <h1 class="slide-title" id="slide-title">Mavzu Sarlavhasi</h1>
            </div>
            <div class="slide-content" id="slide-text">
                Slayd matni...
            </div>
            <div class="slide-source" id="slide-source">
                Manba: ...
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="prev-btn" onclick="prevSlide()">← Oldingisi</button>
            <span id="counter" style="color: #94a3b8; font-weight: 600;">1 / 20</span>
            <button class="btn" id="next-btn" onclick="nextSlide()">Keyingisi →</button>
        </div>
    </div>

    <script>

            },
            {

            {
                title: "19. Zamonaviy Mustaqillik va Davlat Ramzlari",
                text: "1991-yil 1-septabrda xalqimiz o‘zining haqiqiy milliy mustaqilligiga erishdi. Bugungi zamonaviy dunyoda qadimgi xon yorliqlarining o‘rnini milliy Konstitutsiya va 1990-yil 20-iyunda qabul qilingan 'Davlat mustaqilligi to‘g‘risidagi Deklaratsiya' kabi oliy huquqiy hujjatlar egalladi. Davlat mustaqilligining ramzlari esa Davlat Bayrog‘i, Gerbi va Madhiyasidir. Ushbu ramzlar BMT binosi oldida va jahon arenasida O‘zbekiston Respublikasining mustaqil, teng huquqli va suveren davlat ekanligini namoyish etib turibdi.",
                source: "Isbotlovchi Manba: O‘zbekiston Respublikasining Konstitutsiyasi. 5-modda.",
                model: "gerb.glb"
            },
            {
                title: "20. Xulosa — Tarixiy Davomiylik",
                text: "Xulosa qilib aytganda, qadimgi loy taxtachalardan boshlangan, Turk hoqonligining bo‘ri boshli tug‘lari, Amir Temurning uch halqali muhrlari va o‘rta asrlarning o‘sha murakkab 'vassallikdan mustaqillikkacha bo‘lgan yorliqlar zanjiri'dan o‘tgan davlatchilik an'analari bugun bizning muqaddas Konstitutsiyamiz va davlat atributlarimizda yashamoqda. Tarixiy yorliqlar bugun zamonaviy xalqaro huquq normalariga aylandi. Biz o‘z tariximizni chuqur bilish orqali mustaqilligimiz qanchalik buyuk ildizlarga ega ekanini anglaymiz. E'tiboringiz uchun rahmat!",
                source: "Isbotlovchi Manba: Азаматзия А. История узбекской государственности. – Ташкент: Шарк, 2000.",
                model: "globus.glb" // 20-slayd: globus.glb
            }
        ];

        let currentSlide = 0;

        // THREE.JS SCENE SETUP
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Chiroqlar
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.8);
        dirLight2.position.set(-5, -5, -5);
        scene.add(dirLight2);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Loader
        const loader = new THREE.GLTFLoader();
        let currentModel = null;

        function loadModel(modelName) {
            document.getElementById('loader').style.display = 'block';

            if (currentModel) {
                scene.remove(currentModel);
            }

            loader.load(
                modelName,
                function (gltf) {
                    currentModel = gltf.scene;

                    // Centralize and Auto-scale
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    currentModel.position.x += (currentModel.position.x - center.x);
                    currentModel.position.y += (currentModel.position.y - center.y);
                    currentModel.position.z += (currentModel.position.z - center.z);

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2.2 / maxDim;
                    currentModel.scale.set(scale, scale, scale);

                    scene.add(currentModel);
                    document.getElementById('loader').style.display = 'none';
                },
                undefined,
                function (error) {
                    console.log('Model yuklanishda xato:', error);
                    document.getElementById('loader').style.display = 'none';
                }
            );
        }

        function updateSlide() {
            const slide = slides[currentSlide];
            document.getElementById('slide-num').innerText = `Slayd ${currentSlide + 1} / ${slides.length}`;
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-text').innerText = slide.text;
            document.getElementById('slide-source').innerText = slide.source;
            document.getElementById('counter').innerText = `${currentSlide + 1} / ${slides.length}`;

            document.getElementById('prev-btn').disabled = currentSlide === 0;
            document.getElementById('next-btn').disabled = currentSlide === slides.length - 1;

            loadModel(slide.model);
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }

        // Animatsiya loop
        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) {
                currentModel.rotation.y += 0.005; // Sekin va chiroyli aylanish
            }
            controls.update();
            renderer.render(scene, camera);
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Boshlash
        updateSlide();
        animate();
    </script>
</body>
</html>
