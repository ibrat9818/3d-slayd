  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent-color: #58a6ff;
      --gold-color: #d29922;
      --text-main: #c9d1d9;
      --text-title: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 15px 30px;
      background: rgba(13, 17, 23, 0.95);
      border-bottom: 1px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.2rem;
      color: var(--gold-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .slide-counter {
      font-size: 1rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    main {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
      height: calc(100vh - 130px);
    }

    .content-side {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .slide-title {
      font-size: 1.8rem;
      color: var(--text-title);
      margin-bottom: 20px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
    }

    .slide-text {
      font-size: 1.1rem;
      line-height: 1.7;
      color: var(--text-main);
      margin-bottom: 20px;
      text-align: justify;
    }

    .slide-source {
      font-size: 0.9rem;
      font-style: italic;
      color: #8b949e;
      background: rgba(0,0,0,0.3);
      padding: 10px 15px;
      border-left: 3px solid var(--gold-color);
      border-radius: 4px;
    }

    .model-side {
      flex: 1;
      background: rgba(22, 27, 34, 0.5);
      border: 1px solid #30363d;
      border-radius: 12px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      display: none; /* Odatiy holatda yashirilgan */
    }

    model-viewer.active {
      display: block; /* Faqat faol model ko'rinadi */
    }

    footer {
      height: 60px;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 17, 23, 0.95);
      border-top: 1px solid #30363d;
    }

    .nav-btn {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #363b42;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      main {
        flex-direction: column;
        overflow-y: auto;
      }
      .model-side {
        min-height: 350px;
      }
    }
  </style>
</head>

        text: "Amir Temur davlatining o‘ziga xos va dunyoga mashhur ramzi — uchta halqa tasviri bo‘lgan. Mashhur sayyoh Ruy Gonsales de Klavixo o‘z bitiklarida yozishicha, bu uch halqa dunyoning uchta iqlimi (qismi) ustidan hukmronlik va buyuk suverenitet ramzi hisoblangan. Shuningdek, saroyda yuqori lavozimli elchilarga daxlsizlik ramzi sifatida oltin yoki kumush \"Payza\" (taxtacha) berilgan. Harbiy mustaqillik va unvon belgisi sifatida esa hukmdor tomonidan beklarga muqaddas Tug‘ (bayroq) va ulug‘ Nog‘ora topshirilgan. Soliq imtiyozi beruvchi hujjatlar esa \"Tarxonlik yorlig‘i\" deb atalgan.",

    let currentIndex = 0;

    function renderSlide(index) {
      const slide = slides[index];
      document.getElementById('slide-title').innerText = slide.title;
      document.getElementById('slide-text').innerText = slide.text;
      document.getElementById('slide-source').innerText = slide.source;
      document.getElementById('slide-counter').innerText = `${index + 1} / ${slides.length}`;
      
      // Barcha 3D modellarni yashirib, faqat joriy slaydnikini ko'rsatamiz
      document.querySelectorAll('model-viewer').forEach((mv, i) => {
        if (i === index) {
          mv.classList.add('active');
        } else {
          mv.classList.remove('active');
        }
      });

      document.getElementById('prev-btn').disabled = index === 0;
      document.getElementById('next-btn').disabled = index === slides.length - 1;
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      }
    });

    // Boshlang'ich yuklash
    renderSlide(currentIndex);
  </script>
</body>
